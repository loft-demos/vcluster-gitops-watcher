nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Argo CD settings shared by the watcher and its RBAC. Namespaced RBAC is
# created in each distinct Argo CD namespace below, not in the release
# namespace, so the chart can be installed outside of the Argo CD namespace.
argocd:
  namespace: argocd
  # Empty defaults to argocd.namespace.
  applicationNamespace: ""
  # Empty defaults to argocd.namespace.
  clusterSecretNamespace: ""
  # Ordered list of expected cluster name templates. The default auto-detects
  # both the v2 ("connector", virtualcluster infix) and legacy v1 (vcluster
  # infix) conventions. Each template is also tried with the v2 "-argocd" suffix.
  clusterSecretNameTemplates:
    - "loft-{project}-virtualcluster-{virtualcluster}"
    - "loft-{project}-vcluster-{virtualcluster}"
  # Optional Argo CD REST API discovery/fallback. Only needed when cluster
  # Secrets or Applications are NOT readable from this cluster (for example a
  # fully Akuity-hosted Argo CD). The API is never used to pause.
  api:
    # Empty disables API discovery.
    base: ""
    # Existing Secret holding the Argo CD API token. Required when base is set.
    existingSecret: ""
    tokenKey: token
    # Optional key in the same Secret holding a CA bundle for the API endpoint.
    caKey: ""
    insecure: false
    timeout: ""

watcher:
  enabled: true

  # Must stay 1: the watcher polls and patches without leader election.
  replicaCount: 1

  image:
    repository: ghcr.io/loft-demos/vcluster-gitops-watcher
    # Empty uses Chart.yaml appVersion.
    tag: ""
    # Optional sha256 digest. When set, it takes precedence over tag.
    digest: ""
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  rbac:
    create: true

  # vCluster Platform host or base URL, for example platform.example.com.
  # Recommended: matches cluster Secrets by the exact server URL the platform
  # registers, and is required to tell this platform's Secrets apart when
  # several platforms share one Argo CD.
  platformHost: ""

  pollInterval: 2s
  projectNamespacePrefixes:
    - p-
    - loft-p-
  # Patch non-Kargo Application.status.health to Suspended/Progressing while the
  # destination is asleep or waking.
  patchApplicationHealth: true
  sleepingMessage: ""
  wakingMessage: ""

  # Grants read access to Kargo Promotions so active argocd-update promotions
  # can wake sleeping destinations early.
  kargo:
    enabled: true

  # DNS prefix of the watcher's own VCI annotations, such as <prefix>/wake.
  # Set it to a domain you control if you fork the watcher.
  annotationPrefix: gitops-watcher.loft-demos.github.io

  # Optional direct wake requests. Leave upstreamBase empty and set useProxy
  # (with proxy.enabled) to route wakes through the bundled wakeup proxy.
  wake:
    # What to do when a sleeping VCI has pending GitOps work, for VCIs without
    # the <annotationPrefix>/wake annotation ("true", "false", or "sync"):
    #   enabled  - wake it and let the normal sleep timer apply
    #   disabled - never wake it
    #   sync     - wake it, wait for the deploy to finish, then put it straight
    #              back to sleep unless someone else used it meanwhile
    # Sleeping VCIs are paused in every mode.
    default: enabled
    # Tuning for "sync" mode.
    sleepAfterSync:
      # Give up and leave the normal sleep timer in charge if the deploy is not
      # synced and healthy (and its Kargo Stage Ready) within this time.
      timeout: 15m
      # Minimum time after the VCI becomes ready before the deploy counts as
      # done, so Argo CD has time to notice the new revision.
      settle: 1m
      # Sleep-mode subject of the wake credential, for example
      # loft:user:gitops-watcher, used to tell the watcher's own activity apart
      # from real users. Derived automatically with accessKey.user/team.
      subject: ""
    # vCluster Platform base URL, for example https://platform.example.com.
    upstreamBase: ""
    # When true and proxy.enabled is true, wakes go to the proxy Service and
    # upstreamBase is ignored.
    useProxy: false
    # Existing Secret holding a vCluster Platform access key for wake requests.
    # Use a dedicated key, not the Argo CD integration access key: since
    # vCluster Platform v4.12.0 that key can never wake a sleeping tenant cluster.
    # Still needed with useProxy: the proxy forwards the watcher's Authorization
    # header upstream. Leave empty when accessKey.user or accessKey.team is set.
    existingSecret: ""
    tokenKey: token
    # Instead of providing existingSecret, let the watcher get a short-lived
    # wake token per tenant cluster from vCluster Platform while impersonating
    # this Platform user or team. It needs access to the tenant clusters to
    # wake; a dedicated user such as gitops-watcher is recommended. The
    # watcher is granted impersonate on only this user (or team) and create
    # on virtualclusterinstances/kubeconfig. It no longer creates AccessKeys.
    accessKey:
      user: ""
      team: ""
      # Lifetime of each wake token. Platform deletes the AccessKey behind it
      # once it expires.
      tokenTTL: 10m
    timeout: ""
    retryInterval: ""
    # Additional wake response codes treated as accepted, beyond 200 and 202.
    successOn: ""
    # Best-effort patch of the VCI sleep lastActivity after a successful wake.
    # Also adds the virtualclusterinstances/status patch RBAC.
    updateVCILastActivity: false

  # Additional environment variables, for example WATCH_KUBERNETES_TIMEOUT.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 10

# Optional vcluster-wakeup-proxy. Sits in front of the vCluster Platform API and
# treats transient 502/504 responses to wake requests as accepted.
proxy:
  enabled: false

  replicaCount: 1

  image:
    repository: ghcr.io/loft-demos/vcluster-wakeup-proxy
    # Empty uses Chart.yaml appVersion.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Creates a Role in refreshSecret.namespace that can patch Argo CD cluster
  # Secrets, used only when refreshSecret is configured.
  rbac:
    create: true

  service:
    type: ClusterIP
    port: 8080

  # Required when proxy.enabled is true.
  upstreamBase: ""
  upstreamTimeout: ""
  successOn: "502,504"
  successOnError: true

  wakeReady:
    # Empty disables the readiness wait.
    timeout: 30s
    interval: 2s
    path: ""

  # Post-wake Argo CD cluster Secret refresh. Set namespace plus exactly one of
  # name or nameTemplate to enable it.
  refreshSecret:
    namespace: ""
    name: ""
    nameTemplate: ""

  logRequests: false

  extraEnv: []

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 10

{{- if and .Values.watcher.enabled .Values.watcher.rbac.create }}
{{- $fullname := include "vcluster-gitops-watcher.fullname" . }}
{{- $sa := include "vcluster-gitops-watcher.watcherServiceAccountName" . }}
{{- $appNs := include "vcluster-gitops-watcher.applicationNamespace" . }}
{{- $secretNs := include "vcluster-gitops-watcher.clusterSecretNamespace" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vcluster-gitops-watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: watcher
rules:
  - apiGroups: ["management.loft.sh"]
    resources: ["virtualclusterinstances"]
    verbs: ["get", "list", "watch"]
  # Refresh and sync requests vCluster Platform is waiting on Argo CD for
  # (Stack task retries, the Platform UI's Refresh and Sync buttons).
  - apiGroups: ["management.loft.sh"]
    resources: ["argocdapplications"]
    verbs: ["get", "list"]
  {{- if or .Values.watcher.wake.upstreamBase (and .Values.watcher.wake.useProxy .Values.proxy.enabled) }}
  # Sleep after sync sets sleepmode.loft.sh/force on a VCI once its deploy is
  # done. Any VCI can opt in with the wake annotation, so this is not limited
  # to wake.default=sync.
  - apiGroups: ["management.loft.sh"]
    resources: ["virtualclusterinstances"]
    verbs: ["patch"]
  {{- end }}
  {{- if and .Values.watcher.wake.updateVCILastActivity (not (or .Values.watcher.wake.upstreamBase (and .Values.watcher.wake.useProxy .Values.proxy.enabled))) }}
  # Activity is recorded with the sleepmode.loft.sh/last-activity annotations;
  # VCIs have no status subresource. Already granted above when wakes are on.
  - apiGroups: ["management.loft.sh"]
    resources: ["virtualclusterinstances"]
    verbs: ["patch"]
  {{- end }}
  {{- $accessKey := .Values.watcher.wake.accessKey }}
  {{- if and (or .Values.watcher.wake.upstreamBase (and .Values.watcher.wake.useProxy .Values.proxy.enabled)) (or $accessKey.user $accessKey.team) }}
  # Short-lived wake tokens: request a token kubeconfig for a VCI while
  # impersonating only the configured Platform user or team.
  {{- $impersonateUser := ternary $accessKey.user (printf "loft:team:%s" $accessKey.team) (not (empty $accessKey.user)) }}
  {{- $impersonateGroup := ternary (printf "loft:user:%s" $accessKey.user) (printf "loft:team:%s" $accessKey.team) (not (empty $accessKey.user)) }}
  - apiGroups: [""]
    resources: ["users"]
    resourceNames: [{{ $impersonateUser | quote }}]
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["groups"]
    resourceNames: [{{ $impersonateGroup | quote }}]
    verbs: ["impersonate"]
  - apiGroups: ["management.loft.sh"]
    resources: ["virtualclusterinstances/kubeconfig"]
    verbs: ["create"]
  {{- end }}
  {{- if .Values.watcher.kargo.enabled }}
  - apiGroups: ["kargo.akuity.io"]
    resources: ["promotions"]
    verbs: ["get", "list", "watch"]
  # Sleep after sync waits for the Stage to be Ready (verified) first.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vcluster-gitops-watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: watcher
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}
{{- range $ns := list $appNs $secretNs | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ $ns }}
  labels:
    {{- include "vcluster-gitops-watcher.labels" $ | nindent 4 }}
    app.kubernetes.io/component: watcher
rules:
  {{- if eq $ns $secretNs }}
  # list discovers cluster Secrets by the argocd.argoproj.io/secret-type=cluster
  # label (v1 and v2 integrations); patch drives the skip-reconcile pause.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "patch"]
  {{- end }}
  {{- if eq $ns $appNs }}
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications/status"]
    verbs: ["patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ $ns }}
  labels:
    {{- include "vcluster-gitops-watcher.labels" $ | nindent 4 }}
    app.kubernetes.io/component: watcher
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
{{- end }}
{{- end }}

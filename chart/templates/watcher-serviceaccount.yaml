{{- if and .Values.watcher.enabled .Values.watcher.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vcluster-gitops-watcher.watcherServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vcluster-gitops-watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: watcher
  {{- with .Values.watcher.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

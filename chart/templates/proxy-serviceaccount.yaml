{{- if and .Values.proxy.enabled .Values.proxy.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vcluster-gitops-watcher.proxyServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vcluster-gitops-watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.proxy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vcluster-gitops-watcher
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vcluster-gitops-watcher-vci-read
rules:
  - apiGroups: ["management.loft.sh"]
    resources: ["virtualclusterinstances"]
    verbs: ["get", "list", "watch"]
  # Refresh and sync requests vCluster Platform is waiting on Argo CD for.
  - apiGroups: ["management.loft.sh"]
    resources: ["argocdapplications"]
    verbs: ["get", "list"]
  # Only needed for WATCH_WAKE_DEFAULT=sync or the wake: "sync" annotation,
  # which set sleepmode.loft.sh/force on a VCI after its deploy finishes, and
  # for WATCH_UPDATE_VCI_LAST_ACTIVITY_ON_WAKE (sleepmode.loft.sh/last-activity).
  - apiGroups: ["management.loft.sh"]
    resources: ["virtualclusterinstances"]
    verbs: ["patch"]
  - apiGroups: ["kargo.akuity.io"]
    resources: ["promotions"]
    verbs: ["get", "list", "watch"]
  # Sleep after sync waits for the Kargo Stage to be Ready (verified).
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vcluster-gitops-watcher-vci-read
subjects:
  - kind: ServiceAccount
    name: vcluster-gitops-watcher
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vcluster-gitops-watcher-vci-read
---
# Optional: only for WATCH_WAKE_ACCESS_KEY_USER / WATCH_WAKE_ACCESS_KEY_TEAM,
# where the watcher gets short-lived wake tokens by impersonating that Platform
# user. Replace gitops-watcher with the configured user. For a team, use
# "loft:team:<team>" as both the user and the group name.
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: vcluster-gitops-watcher-wake-tokens
# rules:
#   - apiGroups: [""]
#     resources: ["users"]
#     resourceNames: ["gitops-watcher"]
#     verbs: ["impersonate"]
#   - apiGroups: [""]
#     resources: ["groups"]
#     resourceNames: ["loft:user:gitops-watcher"]
#     verbs: ["impersonate"]
#   - apiGroups: ["management.loft.sh"]
#     resources: ["virtualclusterinstances/kubeconfig"]
#     verbs: ["create"]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: vcluster-gitops-watcher-wake-tokens
# subjects:
#   - kind: ServiceAccount
#     name: vcluster-gitops-watcher
#     namespace: argocd
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: ClusterRole
#   name: vcluster-gitops-watcher-wake-tokens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vcluster-gitops-watcher-argocd-write
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # list is required to discover Argo CD cluster Secrets by the
    # argocd.argoproj.io/secret-type=cluster label, which covers both the
    # legacy (v1) platform-created Secrets and v2 API-registered Secrets whose
    # metadata.name is auto-generated by Argo CD. get/patch remain for the
    # skip-reconcile pause path. watch is included for future informer use.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vcluster-gitops-watcher-argocd-write
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: vcluster-gitops-watcher
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vcluster-gitops-watcher-argocd-write
